<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#0b0e14">
  <title>Cenovicz Oftalmologia - Apresentação TV</title>
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- Manifest for Smart TV & PWA -->
  <link rel="manifest" href="manifest.json">
  
  <!-- Stylesheet -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app" class="transition-fade">
    <!-- Viewport with 2 Image Layers for Seamless GPU Crossfade -->
    <div class="slides-viewport" id="slidesViewport">
      <div class="slide-layer active" id="layerA">
        <img id="imgA" src="slides/slide_01.png" alt="Slide Cenovicz Oftalmologia">
      </div>
      <div class="slide-layer" id="layerB">
        <img id="imgB" src="slides/slide_02.png" alt="Slide Cenovicz Oftalmologia">
      </div>
    </div>

    <!-- Floating HUD (Auto-hides on TV idle) -->
    <div class="hud-container" id="hudContainer">
      <!-- Top Bar Widgets -->
      <header class="hud-top">
        <div class="clock-widget" id="clockWidget">
          <span class="clinic-badge">Cenovicz Oftalmologia</span>
          <span class="clock-time" id="clockTime">00:00</span>
          <span class="clock-date" id="clockDate">Segunda, 01 de Jan</span>
        </div>

        <div class="hud-status">
          <div class="status-badge" id="statusBadge">
            <span class="status-indicator-dot"></span>
            <span id="statusText">Transmitindo</span>
            <span style="color: var(--text-muted)">•</span>
            <span class="slide-counter" id="slideCounter">01 / 21</span>
          </div>
        </div>
      </header>

      <!-- Bottom Floating Controls -->
      <nav class="hud-bottom" id="hudBottom">
        <button class="control-btn" id="btnPrev" data-tooltip="Anterior (←)" aria-label="Slide Anterior">
          <svg viewBox="0 0 24 24"><path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z"/></svg>
        </button>

        <button class="control-btn btn-play-pause" id="btnPlayPause" data-tooltip="Reproduzir / Pausar (Espaço)" aria-label="Reproduzir ou Pausar">
          <svg id="iconPause" viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
          <svg id="iconPlay" viewBox="0 0 24 24" style="display: none;"><path d="M8 5v14l11-7z"/></svg>
        </button>

        <button class="control-btn" id="btnNext" data-tooltip="Próximo (→)" aria-label="Próximo Slide">
          <svg viewBox="0 0 24 24"><path d="M10 6L8.59 7.41 13.17 12l-4.58 4.59L10 18l6-6z"/></svg>
        </button>

        <div class="control-divider"></div>

        <button class="control-btn" id="btnGrid" data-tooltip="Ver Todos os Slides (G)" aria-label="Grade de Slides">
          <svg viewBox="0 0 24 24"><path d="M4 11h5V5H4v6zm0 7h5v-6H4v6zm6 0h5v-6h-5v6zm6 0h5v-6h-5v6zm-6-7h5V5h-5v6zm6-6v6h5V5h-5z"/></svg>
        </button>

        <button class="control-btn" id="btnSettings" data-tooltip="Configurações (S)" aria-label="Configurações">
          <svg viewBox="0 0 24 24"><path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/></svg>
        </button>

        <button class="control-btn" id="btnFullscreen" data-tooltip="Tela Cheia (F)" aria-label="Alternar Tela Cheia">
          <svg id="iconExpand" viewBox="0 0 24 24"><path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/></svg>
          <svg id="iconCompress" viewBox="0 0 24 24" style="display: none;"><path d="M5 16h3v3h2v-5H5v2zm3-8H5v2h5V5H8v3zm6 11h2v-3h3v-2h-5v5zm2-14v3h3v2h-5V5h2z"/></svg>
        </button>
      </nav>
    </div>

    <!-- Linear Progress Bar -->
    <div class="progress-container" id="progressContainer">
      <div class="progress-bar" id="progressBar"></div>
    </div>

    <!-- Slide Grid Modal -->
    <div class="modal-backdrop" id="modalGrid">
      <div class="modal-window">
        <div class="modal-header">
          <h2 class="modal-title">
            <svg viewBox="0 0 24 24"><path d="M4 11h5V5H4v6zm0 7h5v-6H4v6zm6 0h5v-6h-5v6zm6 0h5v-6h-5v6zm-6-7h5V5h-5v6zm6-6v6h5V5h-5z"/></svg>
            Índice de Slides da Apresentação
          </h2>
          <button class="btn-close-modal" id="btnCloseGrid" aria-label="Fechar">&times;</button>
        </div>
        <div class="modal-body">
          <div class="slide-grid-container" id="slideGridContainer">
            <!-- Dynamically generated items -->
          </div>
        </div>
      </div>
    </div>

    <!-- Settings Modal -->
    <div class="modal-backdrop" id="modalSettings">
      <div class="modal-window">
        <div class="modal-header">
          <h2 class="modal-title">
            <svg viewBox="0 0 24 24"><path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/></svg>
            Configurações da Smart TV
          </h2>
          <button class="btn-close-modal" id="btnCloseSettings" aria-label="Fechar">&times;</button>
        </div>
        <div class="modal-body">
          <form class="settings-form" id="settingsForm" onsubmit="event.preventDefault();">
            <div class="settings-group">
              <label class="settings-label" for="settingDuration">Tempo por Slide:</label>
              <select class="settings-select" id="settingDuration">
                <option value="6">6 segundos (Rápido)</option>
                <option value="8">8 segundos</option>
                <option value="10">10 segundos</option>
                <option value="12" selected>12 segundos (Recomendado)</option>
                <option value="15">15 segundos</option>
                <option value="20">20 segundos</option>
                <option value="30">30 segundos (Lento)</option>
                <option value="60">1 minuto</option>
              </select>
            </div>

            <div class="settings-group">
              <label class="settings-label" for="settingTransition">Efeito de Transição:</label>
              <select class="settings-select" id="settingTransition">
                <option value="fade" selected>Dissolvência Suave (Fade)</option>
                <option value="zoom">Cinemático (Zoom & Fade)</option>
                <option value="slide">Deslizamento Lateral (Slide)</option>
              </select>
            </div>

            <div class="settings-toggle-row">
              <span class="settings-label">Exibir Relógio e Data</span>
              <label class="toggle-switch">
                <input type="checkbox" id="settingShowClock" checked>
                <span class="toggle-slider"></span>
              </label>
            </div>

            <div class="settings-toggle-row">
              <span class="settings-label">Exibir Barra de Progresso</span>
              <label class="toggle-switch">
                <input type="checkbox" id="settingShowProgress" checked>
                <span class="toggle-slider"></span>
              </label>
            </div>

            <div class="settings-group">
              <label class="settings-label" for="settingAutoReload">Auto-Recarga para TV 24/7 (Limpeza de Memória):</label>
              <select class="settings-select" id="settingAutoReload">
                <option value="0">Desativado</option>
                <option value="2">A cada 2 horas</option>
                <option value="4">A cada 4 horas</option>
                <option value="6" selected>A cada 6 horas (Recomendado)</option>
                <option value="12">A cada 12 horas</option>
              </select>
            </div>

            <!-- TV Remote & Keyboard Shortcuts -->
            <div class="shortcuts-card">
              <div class="shortcut-item"><span class="kbd-badge">→ / Enter</span><span>Próximo</span></div>
              <div class="shortcut-item"><span class="kbd-badge">←</span><span>Anterior</span></div>
              <div class="shortcut-item"><span class="kbd-badge">Espaço</span><span>Pausar / Play</span></div>
              <div class="shortcut-item"><span class="kbd-badge">F</span><span>Tela Cheia</span></div>
              <div class="shortcut-item"><span class="kbd-badge">G</span><span>Grade de Slides</span></div>
              <div class="shortcut-item"><span class="kbd-badge">S</span><span>Configurações</span></div>
            </div>
          </form>
        </div>
      </div>
    </div>

    <!-- Toast Notification Message -->
    <div class="toast-container" id="toastContainer">Slide atualizado</div>
  </div>

  <!-- Scripts -->
  <script src="js/slides-data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
